# Local stack: PostgreSQL + Billing API + MCP server + Kong gateway.
# The billing API is NOT published on the host: the only way in is through Kong (:8000).
#   docker compose up --build
#   gateway  -> http://localhost:8000   (Swagger: http://localhost:8000/docs)
#   mcp      -> http://localhost:8001/mcp
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: billing
      POSTGRES_PASSWORD: billing
      POSTGRES_DB: billing
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billing"]
      interval: 3s
      retries: 20

  billing-api:
    build: ./billing-api
    environment:
      DATABASE_URL: postgresql+psycopg://billing:billing@db:5432/billing
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-me-0123456789}
      GATEWAY_SECRET: ${GATEWAY_SECRET:-local-gateway-secret-0123456789}
    depends_on:
      db: { condition: service_healthy }
    expose: ["8000"]

  mcp-server:
    build: ./mcp-server
    ports: ["8001:8001"]

  gateway:
    build: ./gateway/kong
    environment:
      BILLING_API_URL: http://billing-api:8000
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-me-0123456789}
      GATEWAY_SECRET: ${GATEWAY_SECRET:-local-gateway-secret-0123456789}
    depends_on: [billing-api]
    ports: ["8000:8000"]

volumes:
  pgdata:
